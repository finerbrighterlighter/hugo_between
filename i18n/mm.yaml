# မှတ်တမ်းတင် Facebook ပို့စ်များအပေါ်က မှတ်ချက်။
archive_note: "၂၀၁၈-၂၀၂၁ ဝန်းကျင်ခန့်က ရေးခဲ့ပြီး Facebook မှာ ပထမဆုံး တင်ခဲ့တာဖြစ်ကာ မှတ်တမ်းအနေနဲ့ ဒီမှာ သိမ်းထားတာပါ။ စာလုံးပေါင်းပြင်ပြီး စာစီစာရိုက်ပုံစံ ပြန်ပြင်ထားတယ်၊ စကားလုံးတစ်လုံးမှ ပြန်မရေးထားပါဘူး။ ထိုအချိန်ကတည်းက ကျွန်တော့်အမြင်တွေ ပြောင်းသွားတာလည်း ဖြစ်နိုင်သလို မပြောင်းတာလည်း ဖြစ်နိုင်ပါတယ်။"
