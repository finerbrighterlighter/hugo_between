# The caption is assembled in partials/ielts-chart.html from these pieces, so the
# specifics that change with the data — the retake's date and skill, the years
# covered, every band score read out for a screen reader — come from
# data/ielts.yml rather than being typed here and going quietly stale.
ielts_caption: "One box per skill, every sitting drawn on top; the solid dot is the most recent."
ielts_caption_retake: "The open ring is the {{ .when }} One Skill Retake: only {{ .skill }} was re-sat, so only it and the overall band carry a mark from it."
ielts_caption_retakes: "Open rings are One Skill Retakes: one component re-sat, the rest carried over."
ielts_caption_n: "Too few tests for a quartile to mean much, which is why the dots stay."
ielts_aria: "Box plots of IELTS band scores by skill, {{ .from }} to {{ .to }}, on a scale of 0 to 9, with every sitting plotted. {{ .series }}"
# The hover label on each mark and each box. Kept short: the box is drawn inside
# the figure and its width is estimated from the character count, so a long
# string is a wide box. The row already names the skill, so the label does not.
ielts_mark_hint: "{{ .when }} · band {{ .band }}"
ielts_mark_hint_retake: "{{ .when }} · band {{ .band }} · retake"
ielts_box_hint: "median {{ .med }} · middle half {{ .q1 }}–{{ .q3 }} · range {{ .lo }}–{{ .hi }}"

# The standing note above every archived Facebook post. It says what was changed
# and what was not, because the value of an archive is that it is not edited.
