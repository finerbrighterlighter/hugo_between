career_profile:
  title: "လုပ်ငန်းခွင်ဆိုင်ရာ ကိုယ်ရေးအကျဉ်း"
  para1: >-
    ထိုင်းနိုင်ငံ၊ [ဘန်ကောက်မြို့](https://upload.wikimedia.org/wikipedia/commons/4/49/Th-Bangkok_ceremonial_name.ogg "ကြုင်ဒေဝ မဟာနဂရ အမရ ရတနကောသိန္ဒြ မဟိန္ဒြာယုဒ္ဓျာ မဟာအတိလောကဘဝ နဝရတန ရာဇဌာနီ ပုရီရမ္မ ဥတ္တမ ရာဇနိဝေသန မဟာဌာန အမရဝိမာန အဝတာရဌိတ သက္ကဒတ္တိယ ဝိၐ္နုကရ်္မ ပြသိဒ္ဓိ") အခြေစိုက်ဖြစ်ပြီး ကျန်းမာရေးစောင့်ရှောက်မှု သုတေသနနှင့် ကျန်းမာရေးဒေတာသိပ္ပံ (Health Data Science) နယ်ပယ်တွင် အဓိကလုပ်ကိုင်နေပါသည်။ အဓိကစိတ်ဝင်စားသည့် သုတေသနနယ်ပယ်မှာ လက်တွင်းရှိစုဆောင်းပြီး ဒေတာများ (Secondary data)၊ အထူးသဖြင့် ဆေးကုသမှုမှတ်တမ်း (Electronic Medical Records) များကို အခြေခံ၍ ကူးစက်ရောဂါဗေဒနှင့် လက်တွေ့ဆေးပညာဆိုင်ရာ မေးခွန်းများကို ဖြေရှင်းရန် **မည်သည့်အချိန်တွင်၊ မည်သည့်အကြောင်းကြောင့်၊ မည်သို့** ပြန်လည်အသုံးချနိုင်မည်နည်းဟူသည့်အချက်ကို လေ့လာရန်ဖြစ်ပါသည်။
  para2: >-
    လုပ်ငန်းဆောင်ရွက်မှုအနေဖြင့် ၂၀၁၀ ခုနှစ်မှ စတင်သော ဆေးကုသမှု မှတ်တမ်းများမှ ဆင်းသက်သည့် ကြီးမားသော ရေရှည်ဒေတာစုများ (Longitudinal cohorts) ကို ပြုစုပြင်ဆင်ခြင်းနှင့် ဆန်းစစ်ခြင်းတို့ကို ဦးစားပေးလုပ်ဆောင်ပါသည်။ လက်ရှိတွင် [သွေးတိုးရောဂါ](https://www.rama.mahidol.ac.th/ceb/CEBdatawarehouse/Data/HT) နှင့် [မှတ်ဉာဏ်ချို့ယွင်းမှုရောဂါ](https://www.rama.mahidol.ac.th/ceb/CEBdatawarehouse/Data/Dimentia) ဆိုင်ရာ ဒေတာစုများကို ထိန်းသိမ်းကိုင်တွယ်နေပြီး၊ ယခင်ကလည်း [ဝမ်းဗိုက်ပိုင်းဆိုင်ရာ ခွဲစိတ်ကုသမှု](https://www.rama.mahidol.ac.th/ceb/CEBdatawarehouse/Data/Surgery) ဒေတာစု တည်ဆောက်ခြင်းနှင့် အသုံးပြုခြင်းလုပ်ငန်းများတွင် ပါဝင်ဆောင်ရွက်ခဲ့ပါသည်။ ဤစီမံကိန်းများမှ သုတေသန စာတမ်းစာစောင်များစွာကို အထောက်အကူပြုနိုင်ခဲ့ပြီး နောက်ထပ်လေ့လာမှုများ ဆက်လက်ဆောင်ရွက်နေဆဲဖြစ်ပါသည်။
  para3: >-
    နည်းပညာပိုင်းတွင် Python ကို အဓိကအသုံးပြုပြီး R ကိုလည်း လိုအပ်သလို တွဲဖက်အသုံးပြုပါသည်။ အတိုင်းအတာကြီးမားသော လူဦးရေဆိုင်ရာ ဒေတာများကို ဆန်းစစ်ရာတွင် HPC cluster များနှင့် Job scheduler များကို အခြေခံ၍ ကိုင်တွယ်ဆောင်ရွက်ပါသည်။ အကျဉ်းချုပ်အနေဖြင့် ဆေးကုသမှုမှတ်တမ်းများကို အသုံးပြုပြီး ပြန်စစ်ဆေးခြင်း၊ အတည်ပြုခြင်းနှင့် သက်သေပြချက် ထုတ်ပေးခြင်း သုတေသနများအတွက် စံချိန်မှီ ရေရှည်ဒေတာစုများအဖြစ် ပြောင်းလဲတည်ဆောက်ပေးခြင်း ဖြစ်ပါသည်။ 

