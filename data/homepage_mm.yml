experiences:
  title: သုတေသနနှင့် လုပ်ငန်းဆောင်ရွက်မှုများ
  info:
    - role: ဘွဲ့လွန် သုတေသန လက်ထောက်
      time: ၂၀၂၁ - လက်ရှိ
      company: *mahidol_mm
      details: |
        မဟီဒေါလ်တက္ကသိုလ် ရာမာသီဘိုဒီ ဆေးကျောင်း လက်တွေ့ ကူးစက်ရောဂါဗေဒနှင့် ဇီဝစာရင်းအင်းပညာဌာန ရှိ ဒေတာသိပ္ပံနှင့် လက်တွေ့သတင်းအချက်အလက်ဗေဒဌာနခွဲ တွင် တာဝန်ထမ်းဆောင်လျက်ရှိပါသည်။

        လုပ်ငန်းဆောင်ရွက်မှုအနေဖြင့် ပုံမှန်စုဆောင်းရရှိသော ဆေးကုသမှုမှတ်တမ်းများကို သုတေသနစံချိန်မှီ ရေရှည်ဒေတာစုများ အဖြစ် ပြောင်းလဲတည်ဆောက်ပေးခြင်းကို အဓိကထား လုပ်ဆောင်ပါသည်။ [CEB ဒေတာသိုလှောင်ရုံ](https://www.rama.mahidol.ac.th/ceb/CEBdatawarehouse/Overview) ရှိ သွေးတိုးရောဂါနှင့် မှတ်ဉာဏ်ချို့ယွင်းမှုရောဂါဆိုင်ရာ ဒေတာစုများကို အဓိကတာဝန်ယူ ကိုင်တွယ်လျက်ရှိပြီး ကူးစက်ရောဂါဗေဒနှင့် လက်တွေ့ဆေးပညာဆိုင်ရာ သုတေသနလုပ်ငန်းများကို အထောက်အကူပြုလျက်ရှိပါသည်။

    - role: ဘွဲ့လွန် သုတေသန ကျောင်းသား
      time: ၂၀၁၉ - ၂၀၂၁
      company: *mahidol_mm
      details: |
        ထိုင်းလူမျိုးများအကြား ဖြစ်ပွားသော သွားဖုံးရောင်ရောဂါ နှင့် ပတ်သက်သည့် ဘွဲ့လွန်သုတေသနလုပ်ငန်းများကို ပါမောက္ခ [Ammarin Thakkinstian](https://www.scopus.com/authid/detail.uri?authorId=6602111727) နှင့် [Anuchate Pattanateepapon](https://www.scopus.com/authid/detail.uri?authorId=57193164364) တို့၏ လမ်းညွှန်ကြီးကြပ်မှုအောက်တွင် ဆောင်ရွက်ခဲ့ပါသည်။ 

        ရောဂါဖြစ်ပွားမှုနှင့် ဆက်စပ်နေသော အချက်အလက်များကို လေ့လာဆန်းစစ်ခဲ့ပြီး၊ စာရင်းအင်းဗေဒ (Statistical) နှင့် စက်သင်ယူမှု (Machine Learning) ဆိုင်ရာ အမျိုးအစားခွဲခြားခြင်း နည်းလမ်းများကို အသုံးပြု၍ ရောဂါရှာဖွေစစ်ဆေးမှု မော်ဒယ် (Screening models)များကို တည်ဆောက်ဖော်ထုတ်ခဲ့ပါသည်။

    - role: အလုပ်သင် သွားဆရာဝန်
      time: ၂၀၁၈
      company: *udmy_mm
      details: |
        တက္ကသိုလ်တွဲဖက်ဆေးရုံတွင် တစ်နှစ်တာ လက်တွေ့ကုသမှု လေ့ကျင့်ရေးအစီအစဉ်ကို ပြီးမြောက်ခဲ့ပါသည်။ ၎င်းကာလအတွင်း သွားညှိကုသပညာ၊ သွားဖုံးရောဂါကုပညာ၊ သွားတုဆေးပညာ၊ ခံတွင်းဆေးပညာ နှင့် ကာကွယ်ရေးနှင့်လူထုသွားကျန်းမာရေးပညာ အပါအဝင် ဘာသာရပ်အမျိုးမျိုးတွင် လက်တွေ့ဆင်း၍ လေ့လာသင်ယူခဲ့ပါသည်။

    - role: ဘွဲ့ကြို သုတေသန လက်ထောက်
      time: ၂၀၁၈
      company: *udmy_mm
      details: |
        ကာကွယ်ရေးနှင့်လူထုသွားကျန်းမာရေးပညာ ဌာနရှိ စီမံကိန်းများအတွက် ဒေတာကောက်ယူခြင်းနှင့် ဒေတာထည့်သွင်းခြင်းလုပ်ငန်းများတွင် ပါမောက္ခများ၊ ဘွဲ့လွန်သုတေသီများနှင့်အတူ ပူးပေါင်းဆောင်ရွက်ခဲ့ပါသည်။ 

        လူဦးရေအခြေပြု သုတေသနလုပ်ငန်းများနှင့် လက်တွေ့အသုံးချ ကျန်းမာရေးဒေတာလုပ်ငန်းများကို စောစီးစွာ လေ့လာထိတွေ့ခွင့် ရရှိခဲ့သည့် အခွင့်အလမ်းတစ်ခု ဖြစ်ခဲ့ပါသည်။

