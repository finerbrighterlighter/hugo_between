career_profile:
  title: "Career Profile"
  summary: >-
    My primary interest lies in secondary data research: **understanding when, why, and how** routinely collected
    clinical data, particularly electronic medical records, can be responsibly reused to answer epidemiological and
    clinical questions. At Ramathibodi Hospital in [Bangkok](https://upload.wikimedia.org/wikipedia/commons/4/49/Th-Bangkok_ceremonial_name.ogg "Krungthepmahanakhon Amonrattanakosin Mahintharayutthaya Mahadilokphop Noppharatratchathaniburirom Udomratchaniwetmahasathan Amonphimanawatansathit Sakkathattiyawitsanukamprasit") those records, from 2010 onwards, have been turned into longitudinal cohorts for
    [hypertension](https://www.rama.mahidol.ac.th/ceb/CEBdatawarehouse/Data/HT), [dementia](https://www.rama.mahidol.ac.th/ceb/CEBdatawarehouse/Data/Dementia)
    and abdominal surgery, and I maintain them so they can support real-world evidence. The records are fragmented and
    incomplete; patients are treated elsewhere, drop out, or return years later, and those gaps can bias the conclusions.
    That is where my questions sit.
  para1: >-
    Based in [Bangkok](https://upload.wikimedia.org/wikipedia/commons/4/49/Th-Bangkok_ceremonial_name.ogg "Krungthepmahanakhon Amonrattanakosin Mahintharayutthaya Mahadilokphop Noppharatratchathaniburirom Udomratchaniwetmahasathan Amonphimanawatansathit Sakkathattiyawitsanukamprasit"), Thailand, I work in health care research with a focus on health data science and real-world evidence. My primary interest lies in secondary data research: **understanding when, why, and how** routinely collected clinical data, particularly electronic medical records, can be responsibly reused to answer epidemiological and clinical questions.
  para2: >-
    My work centers on the curation and analysis of large longitudinal cohorts derived from routine clinical visits starting from 2010. I currently maintain real-world cohorts focused on [hypertension](https://www.rama.mahidol.ac.th/ceb/CEBdatawarehouse/Data/HT) and [dementia](https://www.rama.mahidol.ac.th/ceb/CEBdatawarehouse/Data/Dementia), and previously worked on the development and use of [an abdominal surgery data warehouse](https://www.rama.mahidol.ac.th/ceb/CEBdatawarehouse/Data/Surgery). These projects have contributed to multiple peer-reviewed publications, with further studies ongoing.
  para3: >-
    On the technical side, I work primarily in Python with occasional use of R, with HPC clusters and job schedulers for population-scale registry data. In practice, this means turning raw clinical records into longitudinal datasets that hold up to the demands of observational research; replication, validation, and evidence generation.

