experiences:
  title: Experiences
  info:
    - role: Graduate Research Assistant
      role_lan: ผู้ช่วยวิจัย
      time: 2021 - Present
      company: *mahidol
      details: |
        Affiliated with the Data Science and Clinical Informatics division, Department of Clinical Epidemiology and Biostatistics, Faculty of Medicine Ramathibodi Hospital. 
        
        My work focuses on transforming routinely collected electronic medical records into research-ready datasets for longitudinal analysis. I contribute to the [CEB Data Warehouse](https://www.rama.mahidol.ac.th/ceb/CEBdatawarehouse/Overview), with primary responsibility for disease-focused cohorts in hypertension and dementia, supporting epidemiological and clinical research using real-world data.
        

    - role: Graduate Student Researcher
      role_lan: นักศึกษาปริญญาโท
      time: 2019 - 2021
      company: *mahidol
      details: |
        Conducted postgraduate research on severe periodontitis in the Thai population under the supervision of [Ammarin Thakkinstian](https://www.scopus.com/authid/detail.uri?authorId=6602111727) and [Anuchate Pattanateepapon](https://www.scopus.com/authid/detail.uri?authorId=57193164364). 
        
        The work examined factors associated with disease development and involved the development of multiple screening models using statistical and machine-learning classification approaches.
        

    - role: House Officer
      role_lan: အလုပ်သင်သွားဆရာဝန်
      time: 2018
      company: *udmy
      details: |
        Completed a one-year clinical training program at the university-affiliated hospital.
        
        Clincal rotations across multiple dental and oral health specialties, including orthodontics, periodontology, prosthodontics, oral medicine, and community dentistry were undergone.
        

    - role: Undergraduate Research Assistant
      role_lan: အလုပ်သင်သွားဆရာဝန်
      time: 2018
      company: *udmy
      details: |
        Assisted faculty members and postgraduate researchers in data collection and data entry for projects within the Department of Preventive and Community Dentistry.
        
        It was a great opportunity for gaining early exposure to population-based research and applied health data work.
        

