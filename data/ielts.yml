# IELTS Academic band scores, read off the test report forms.
#
# Only the numbers live here. The forms themselves are not published and are not
# in this repository: they carry a candidate ID, a date of birth and a nationality,
# none of which the chart needs.
#
# `retake: true` marks a One Skill Retake — one component re-sat on its own, with
# the other three carried over from the sitting immediately before it. It is shown
# rather than hidden: the point of the chart is how much a measurement moves, and
# a retake is part of that story.
#
# Bands run 0 to 9 in half steps.

sittings:
