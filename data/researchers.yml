# researchers.yml
# Collaborator registry. Works front matter references authors by id.
#
# id convention:
#   - Thai/Burmese authors: given name (more distinctive than family name)
#   - International authors: family name
#   - Myanmar compound given names: hyphenated (aung-min, tun-tun, etc.)
#   - Disambiguation suffix only when given names collide
#     e.g. amarit stays amarit; if he moves institutions, add amarit-nmu
#     both entries share the same orcid
#
# orcid: fill in from ORCID.org — do not guess.
#
# Sort order: me first, then A→Z by id.
# Same-person entries (different institutions, same orcid) sit adjacent.
#
# search by "ID="

