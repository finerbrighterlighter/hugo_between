# Designed for red-green color blindness (deuteranopia / protanopia).
# Colors derived from the Okabe & Ito (2008) Color Universal Design palette —
# the standard recommended by Nature journals and the scientific community.
# Primary: Okabe Sky Blue (#56B4E9 / #0072B2).
# Error: Okabe Vermillion (#D55E00) — orange-shifted, not red, safe for all CVD types.
- id: colorblind
  label: Colorblind
  dark:
    background: "#1c1c1c"
    font: "#f0efeb"
    invert_font: "#1c1c1c"
    primary: "#56b4e9"
    secondary: "#e69f00"
    tertiary: "#2e2e2e"
    error: "#f07000"
    progress_bar_background: "#2e2e2e"
    progress_bar_fill: "#56b4e9"
    code_bg: "#2a2a2a"
  light:
    background: "#fafafa"
    font: "#1c1c1c"
    invert_font: "#fafafa"
    primary: "#0072b2"
    secondary: "#6b5e4a"
    tertiary: "#dcdcdc"
    error: "#4d0000"
    progress_bar_background: "#dcdcdc"
    progress_bar_fill: "#0072b2"
    code_bg: "#efefef"
