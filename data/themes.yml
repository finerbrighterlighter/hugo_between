# Theme palette definitions
# default: light  → author's canonical pick for light mode
# default: dark   → author's canonical pick for dark mode
# Only one theme should carry each default marker.
# if we want a theme to be the default for both modes, we can set default: [dark, light]
- id: duck
  label: Duck
  default: [dark, light]
  dark:
    background: "#2d2a2e"  # Monokai's signature dark purple-grey
    font: "#fcfcfa"        # Near-white foreground
    invert_font: "#2d2a2e"
    primary: "#ffd866"     # Monokai yellow — 100% sat, 70% lightness: airy not harsh
    secondary: "#aaa7aa"   # Comment grey — muted but WCAG AA on dark panels
    tertiary: "#3d3b3f"    # Slightly lighter than bg for panels/containers
    error: "#ff7a9d"       # Monokai red/pink, lifted for AA on dark panels
    progress_bar_background: "#3d3b3f"
    progress_bar_fill: "#ffd866"
    code_bg: "#221f22"     # Slightly darker than bg for code blocks
  light:
    background: "#f8f5f0"  # Near-neutral cream — warmth as whisper, not canvas
    font: "#1c1814"        # Warm dark font
    invert_font: "#f8f5f0"
    primary: "#9c5010"     # Warm amber-orange — readable (≈6:1)
    secondary: "#7a6040"   # Muted warm brown
    tertiary: "#e4dfd8"    # Warm light grey for structural lines
    error: "#b92e00"       # Dropped Brick
    progress_bar_background: "#e4dfd8"
    progress_bar_fill: "#9c5010"
    code_bg: "#f0ece4"     # Slightly warmer than background for code blocks
