{{- /* One name in the collaborator chart: the name, a bar, and the count.
       Expects: r (the row) and max (the largest count, which sets the scale). */ -}}
{{- $r := .r -}}
<li class="collab-row">
  <span class="collab-name">{{ $r.name }}</span>
  <span class="collab-track" aria-hidden="true"><span class="collab-bar" style="width:{{ printf "%.1f" (mul (div (float $r.n) (float .max)) 100.0) }}%"></span></span>
  <span class="collab-n meta">{{ partial "localized-number.html" $r.n }}</span>
</li>
