{{- /* hero: two voices */ -}}
<section class="row hero" id="hero" aria-label="{{ i18n "voice_left" }} / {{ i18n "voice_right" }}" data-section="{{ i18n "nav_sec_intro" }}">
    <div class="voice voice-l">
      <h2 class="word">{{ i18n "voice_left" }}</h2>
      <p>{{ i18n "hero_left" }}</p>
    </div>
    <div class="voice voice-r">
      <h2 class="word">{{ i18n "voice_right" }}</h2>
      <p>{{ i18n "hero_right" }}</p>
    </div>
    {{ partial "quick-links.html" . }}
  </section>
