<!DOCTYPE html>
<html lang="{{ if eq .Site.Language.Lang "mm" }}my{{ else }}{{ .Site.Language.Lang }}{{ end }}" data-theme="light">
<head>
{{ partial "head.html" . }}
{{ block "head-extra" . }}{{ end }}
</head>
<body class="{{ block "body-class" . }}page{{ end }}">
<a class="skip" href="#main">{{ i18n "skip_to_content" }}</a>
{{ partial "masthead.html" . }}
<main id="main" tabindex="-1">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ partial "nav-balloon.html" . }}
{{ partial "scripts.html" . }}
{{ block "scripts-extra" . }}{{ end }}
</body>
</html>
